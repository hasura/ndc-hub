name: Validate registry publication inputs (Staging)

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths: ['registry/**']

permissions:
  contents: read

jobs:
  update_registry_db:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate changed registry data without cloud credentials
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 registry-automation/staging-inputs/prepare.py --pr "$PR_NUMBER" --head "$PR_HEAD_SHA" --output "$RUNNER_TEMP/registry-validation"
