name: Publish reviewed staging registry data

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Open NDC Hub PR targeting main (number)
        required: true
        type: string
      pr_head_sha:
        description: Exact 40-character PR head SHA reviewed by the maintainer
        required: true
        type: string

permissions: {}

concurrency:
  group: ndc-hub-staging-publication
  cancel-in-progress: false

jobs:
  prepare:
    if: github.repository == 'hasura/ndc-hub' && github.ref == 'refs/heads/main' && github.ref_protected && vars.NDC_HUB_STAGING_WIF_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify open PR and exact current head
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
          PR_HEAD_SHA: ${{ inputs.pr_head_sha }}
        run: bash registry-automation/staging-inputs/check-pr.sh
      - name: Build credential-free staging data bundle
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
          PR_HEAD_SHA: ${{ inputs.pr_head_sha }}
        run: python3 registry-automation/staging-inputs/prepare.py --pr "$PR_NUMBER" --head "$PR_HEAD_SHA" --output "$RUNNER_TEMP/staging-bundle"
      - name: Hand off only validated registry data
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: staging-inputs-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/staging-bundle/
          retention-days: 1
          if-no-files-found: error

  publish:
    needs: prepare
    if: github.repository == 'hasura/ndc-hub' && github.ref == 'refs/heads/main' && github.ref_protected && vars.NDC_HUB_STAGING_WIF_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Setup and verify a main-only, independently reviewed publication environment before enabling.
    environment: staging-registry-publish
    permissions:
      contents: read
      pull-requests: read
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: registry-automation/go.mod
          cache: false
      - name: Build the publisher from the protected main commit
        working-directory: registry-automation
        run: go build -mod=readonly -o "$RUNNER_TEMP/registry-publisher" .
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: staging-inputs-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/staging-bundle
      - name: Recheck PR and data bundle before cloud authorization
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
          PR_HEAD_SHA: ${{ inputs.pr_head_sha }}
        run: |
          bash registry-automation/staging-inputs/check-pr.sh
          python3 registry-automation/staging-inputs/prepare.py --verify --pr "$PR_NUMBER" --head "$PR_HEAD_SHA" --output "$RUNNER_TEMP/staging-bundle"
      - name: Authenticate to staging Google Cloud
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          workload_identity_provider: ${{ vars.NDC_HUB_STAGING_WIF_PROVIDER }}
          service_account: registry-writer-sa-staging@hasura-connector-deploy-stg.iam.gserviceaccount.com
      - name: Publish verified registry data to staging
        working-directory: registry-automation
        env:
          PUBLICATION_ENV: staging
          GCP_BUCKET_NAME: staging-connector-platform-registry
          CONNECTOR_REGISTRY_GQL_URL: ${{ secrets.CONNECTOR_REGISTRY_GQL_URL }}
          CONNECTOR_PUBLICATION_KEY: ${{ secrets.CONNECTOR_PUBLICATION_KEY }}
          CLOUDINARY_URL: ${{ secrets.CLOUDINARY_URL }}
        run: |
          ulimit -c 0
          umask 077
          # Never emit PR-controlled values, remote responses, or credentials to Actions logs.
          if ! "$RUNNER_TEMP/registry-publisher" ci --changed-files-path "$RUNNER_TEMP/staging-bundle/changed-files.json" --staging-input-dir "$RUNNER_TEMP/staging-bundle" >"$RUNNER_TEMP/staging-publisher.log" 2>&1; then
            echo '::error::Staging registry publication failed. Check approved registry and GCS telemetry before retrying.'
            exit 1
          fi
          echo 'Staging registry publication completed.'
